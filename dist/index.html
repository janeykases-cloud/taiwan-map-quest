<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4f6c"><meta name="description" content="五年級社會第一單元臺灣地理位置互動闖關"><title>臺灣！我來了｜候鳥領航員地圖闖關</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='15' width='64' height='64' fill='%230b4f6c'/%3E%3Cpath d='M39 7c-5 8-4 15-9 21-7 7-11 13-9 21 2 7 8 10 12 8 5-2 4-9 6-14 2-7 7-9 7-16 0-8-2-15-7-20z' fill='%23f4c95d'/%3E%3C/svg%3E"><style>
:root{--deep:#083d56;--sea:#0b4f6c;--teal:#1b7f79;--mint:#dff4e8;--sun:#f4c95d;--coral:#e76f51;--paper:#fffdf5;--ink:#17343e;--muted:#58707a;--ok:#16724c;--bad:#b33e35;--shadow:0 16px 40px #05324626}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#dff3ef;line-height:1.6}button,input{font:inherit}button{cursor:pointer}.mast{min-height:100vh;display:grid;place-items:center;padding:2rem;background:linear-gradient(155deg,#dff4e8 0 35%,#9fd9dc 35% 63%,#0b4f6c 63%)}.login{width:min(980px,100%);background:#fffdf5f5;border-radius:30px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden}.copy{padding:clamp(1.6rem,5vw,4rem)}.unit{font-weight:850;letter-spacing:.08em;color:var(--teal)}h1{font-size:clamp(2.6rem,7vw,5.8rem);line-height:.96;margin:.2rem 0;color:var(--deep)}h1 span{display:block;color:var(--coral);font-size:.43em;letter-spacing:.08em;margin-top:.7rem}.lead{color:var(--muted)}label{font-weight:850}.row{display:flex;gap:.6rem}.row input{min-width:0;flex:1;border:2px solid var(--teal);border-radius:13px;padding:.85rem}.primary{border:0;border-radius:13px;background:var(--sun);color:#322900;font-weight:900;padding:.85rem 1.2rem;box-shadow:0 5px 0 #c79b25}.privacy{font-size:.8rem;color:var(--muted)}.art{background:var(--sea);padding:2rem;display:grid;place-items:center;color:white;font-weight:800;text-align:center}.art svg{width:min(100%,400px)}#game{display:none}.top{position:sticky;top:0;z-index:20;background:#083d56f5;color:white;border-bottom:4px solid var(--sun)}.topin{width:min(1180px,calc(100% - 2rem));margin:auto;min-height:72px;display:flex;align-items:center;gap:1rem}.brand{font-weight:950}.chip{margin-left:auto;background:white;color:var(--deep);border-radius:99px;padding:.35rem .8rem;font-weight:800}.track{width:160px;height:12px;background:#ffffff40;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--sun)}main{width:min(1180px,calc(100% - 2rem));margin:2rem auto 5rem}.tabs{display:flex;gap:.6rem;overflow:auto}.tabs span{border:2px solid var(--sea);border-radius:99px;padding:.45rem .8rem;font-weight:850;white-space:nowrap;opacity:.45}.tabs .active{background:var(--sea);color:white;opacity:1}.head{display:flex;gap:1rem;align-items:center;margin:1.2rem 0}.no{font:900 4rem/.8 Georgia;color:var(--coral)}.head h2{margin:0;color:var(--deep)}.head p{margin:0;color:var(--muted)}.play{display:grid;grid-template-columns:1.35fr .65fr;gap:1.2rem}.mapcard,.panel{background:var(--paper);border-radius:24px;box-shadow:var(--shadow)}.mapcard{padding:1rem;min-height:580px}.map{position:relative;height:100%;min-height:545px;border-radius:18px;overflow:hidden;background:#72c5cc}.map svg{position:absolute;inset:0;width:100%;height:100%}.zone{position:absolute;min-width:112px;min-height:54px;border:3px dashed white;border-radius:13px;background:#083d5633;color:white;display:grid;place-items:center;text-align:center;font-weight:900;padding:.4rem;transform:translate(-50%,-50%);z-index:3}.zone:before{content:attr(data-n);position:absolute;top:-12px;left:-10px;width:25px;height:25px;border-radius:50%;background:var(--sun);color:#29210c;border:2px solid white}.zone.over{background:#f4c95d77}.zone.correct{border-style:solid;background:var(--ok)}.zone.wrong{background:var(--bad)}.panel{padding:1.2rem;height:max-content;position:sticky;top:94px}.panel h3{margin:0}.help{font-size:.9rem;color:var(--muted)}.bank{display:grid;gap:.65rem}.card{border:2px solid var(--sea);background:white;color:var(--deep);border-radius:12px;padding:.72rem;font-weight:850;text-align:left;box-shadow:0 4px 0 #a9cfd0}.card[aria-pressed="true"]{background:var(--sun)}.card:disabled{opacity:.3}.feedback{min-height:4.5rem;margin-top:1rem;border-radius:12px;padding:.75rem;background:#eaf4f2;font-weight:750}.good{background:#dff3e7;color:var(--ok)}.bad{background:#fbe5df;color:var(--bad)}.hint{border:0;background:none;color:var(--sea);text-decoration:underline;font-weight:800}.next{width:100%;margin-top:.7rem;display:none}.certificate{display:none;background:linear-gradient(135deg,#073a52,#0b4f6c);min-height:100vh;padding:2rem;place-items:center}.paper{width:min(980px,100%);background:var(--paper);border:10px double var(--sun);padding:clamp(1.5rem,5vw,4rem);text-align:center}.paper h2{font:900 clamp(2.6rem,7vw,5.2rem)/1 Georgia;color:var(--deep);margin:.5rem}.name{display:inline-block;border-bottom:3px solid var(--coral);font-size:clamp(1.8rem,5vw,3.2rem);font-weight:950;padding:.2rem 1rem;color:var(--coral)}.seals{display:flex;justify-content:center;gap:.7rem;flex-wrap:wrap}.seal{background:var(--mint);border:2px solid var(--teal);border-radius:99px;padding:.4rem .7rem;font-weight:850;color:var(--teal)}.actions{display:flex;justify-content:center;gap:.7rem}.secondary{border:2px solid var(--sea);background:white;color:var(--sea);border-radius:12px;padding:.75rem;font-weight:850}button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}@media(max-width:780px){.login,.play{grid-template-columns:1fr}.art{min-height:280px}.panel{position:static;order:-1}.topin{flex-wrap:wrap;padding:.5rem 0}.track{order:5}.mapcard{min-height:500px}.map{min-height:465px}}@media(max-width:430px){.row{flex-direction:column}.zone{min-width:82px;font-size:.78rem}.map{min-height:520px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{.certificate{padding:0}.paper{box-shadow:none;width:100%;min-height:95vh;display:grid;align-content:center}.actions{display:none}}
</style></head><body>
<section class="mast" id="login"><div class="login"><div class="copy"><p class="unit">五上社會・第一單元</p><h1>臺灣！我來了<span>候鳥領航員地圖闖關</span></h1><p class="lead">候鳥小隊迷路了！請看懂方位，把答案卡放回正確位置，完成 3 個地圖任務。</p><form id="loginForm"><label for="studentName">學生姓名</label><div class="row"><input id="studentName" maxlength="20" autocomplete="name" placeholder="請輸入姓名" required><button class="primary">開始闖關</button></div><p class="privacy">姓名只會顯示在這台裝置的闖關證明，不會上傳或公開。</p></form></div><div class="art"><div><svg viewBox="0 0 430 430" role="img" aria-label="臺灣位置示意圖"><circle cx="215" cy="215" r="180" fill="#8ad1d1"/><path d="M254 48c-22 34-18 70-43 95-32 32-48 61-38 102 8 31 35 71 58 70 24-1 22-38 31-60 9-29 31-41 31-70 1-45-12-103-39-137z" fill="#dff4e8" stroke="#f4c95d" stroke-width="8"/><g fill="#083d56" font-weight="800" font-size="20"><text x="180" y="30">日本</text><text x="165" y="390">菲律賓</text><text x="28" y="220">中國</text><text x="305" y="220">太平洋</text></g></svg><p>先輸入姓名，領取你的領航員證。</p></div></div></div></section>
<section id="game"><header class="top"><div class="topin"><div class="brand">候鳥領航員</div><div class="chip" id="chip"></div><div class="track" role="progressbar" aria-valuemax="12" aria-valuenow="0"><div class="fill"></div></div><b class="count">0／12</b></div></header><main><nav class="tabs"></nav><div class="head"><div class="no">01</div><div><h2></h2><p></p></div></div><div class="play"><div class="mapcard"><div class="map" id="map"></div></div><aside class="panel"><h3>答案卡</h3><p class="help">拖曳答案卡到地圖，也可以先點答案卡，再點正確位置。</p><div class="bank"></div><div class="feedback" role="status">先觀察臺灣的四周。</div><button class="hint" type="button">給我一個提示</button><button class="primary next" type="button">前往下一關</button></aside></div></main></section>
<section class="certificate" id="cert"><div class="paper"><p class="unit">臺灣時空探險隊</p><h2>闖關成功證明</h2><p><strong class="name"></strong></p><p>完成「臺灣！我來了」候鳥領航員地圖闖關，能正確辨認臺灣周邊位置、區域範圍與四方海岸。</p><div class="seals"><span class="seal">地圖判讀</span><span class="seal">區域定位</span><span class="seal">海岸特色</span></div><p class="date"></p><div class="actions"><button class="primary" onclick="print()">列印／另存證明</button><button class="secondary" onclick="location.reload()">換一位學生</button></div></div></section>
<script>
const base=`<svg viewBox="0 0 700 560" aria-hidden="true"><defs><pattern id="w" width="38" height="22" patternUnits="userSpaceOnUse"><path d="M0 12q9-8 19 0t19 0" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/></pattern></defs><rect width="700" height="560" fill="#72c5cc"/><rect width="700" height="560" fill="url(#w)"/><g transform="translate(105 35) scale(.72 1)"><path d="M383 74c-9 7-15 24-18 40-4 20-12 35-25 51-12 15-17 32-24 49-7 17-20 35-26 54-7 21-3 43 6 62 10 22 22 43 39 60 12 12 25 20 36 13 13-8 12-29 16-45 4-19 18-30 27-45 10-17 11-37 12-57 1-29-5-58-12-86-6-24-14-51-31-46z" fill="#dff4e8" stroke="#f4c95d" stroke-width="10" stroke-linejoin="round"/><path d="M367 136c-7 38-22 70-39 102M395 189c-4 37-15 72-31 101" fill="none" stroke="#1b7f79" stroke-width="7" stroke-linecap="round" opacity=".65"/></g><text x="55" y="58" fill="#083d56" font-weight="900" font-size="20">↑ 北</text></svg>`;
const ms=[{t:'臺灣的四方鄰居',s:'把國家與海洋放到臺灣的正確方位。',h:'上北、下南、左西、右東。日本在臺灣北方，而且隔著一段海域。',a:['日本','菲律賓','中國','太平洋'],z:[['日本',50,5],['菲律賓',50,92],['中國',14,50],['太平洋',86,50]]},{t:'島嶼集合點',s:'把臺灣區域範圍中的島嶼放回地圖。',h:'馬祖在西北方；金門在西方；澎湖在臺灣海峽；釣魚臺在東北方。',a:['馬祖列島','金門群島','澎湖群島','釣魚臺列嶼'],z:[['馬祖列島',23,22],['金門群島',13,58],['澎湖群島',31,55],['釣魚臺列嶼',79,20]]},{t:'海岸巡守隊',s:'把海岸類型放到臺灣北、西、南、東四方。',h:'北部曲折；西部有沙洲；南部有珊瑚礁；東部多斷崖。',a:['岬灣海岸','沙洲海岸','珊瑚礁海岸','斷崖海岸'],z:[['岬灣海岸',52,15],['沙洲海岸',26,54],['珊瑚礁海岸',48,88],['斷崖海岸',73,52]]},{t:'臺灣史前文化遺址',s:'把四處重要遺址放到臺灣地圖的正確位置。',h:'圓山、十三行在北部；八仙洞、卑南在臺東。八仙洞比卑南更北。',a:['八仙洞遺址','圓山遺址','卑南遺址','十三行遺址'],z:[['八仙洞遺址',68,45],['圓山遺址',51,17],['卑南遺址',65,73],['十三行遺址',39,24]]}];let st={name:'',m:0,total:0,sel:null,placed:0};const $=s=>document.querySelector(s);$('.lead').textContent='候鳥小隊迷路了！請看懂方位，把答案卡放回正確位置，完成 4 個地圖任務。';$('.track').setAttribute('aria-valuemax','16');$('.count').textContent='0／16';
$('#loginForm').onsubmit=e=>{e.preventDefault();st.name=$('#studentName').value.trim();if(!st.name)return;$('#chip').textContent=st.name+'・領航員';$('#login').style.display='none';$('#game').style.display='block';render()};
function render(){st.sel=null;st.placed=0;let m=ms[st.m];$('.tabs').innerHTML=ms.map((x,i)=>`<span class="${i===st.m?'active':''}">任務 ${i+1}</span>`).join('');$('.no').textContent=String(st.m+1).padStart(2,'0');$('.head h2').textContent=m.t;$('.head p').textContent=m.s;$('#map').innerHTML=base+m.z.map((z,i)=>`<button class="zone" data-a="${z[0]}" data-n="${i+1}" style="left:${z[1]}%;top:${z[2]}%">放這裡</button>`).join('');$('.bank').innerHTML=[...m.a].sort(()=>Math.random()-.5).map(a=>`<button class="card" draggable="true" data-a="${a}" aria-pressed="false">${a}</button>`).join('');$('.feedback').className='feedback';$('.feedback').textContent='先觀察地圖，再選一張答案卡。';$('.next').style.display='none';wire()}
function wire(){document.querySelectorAll('.card').forEach(c=>{c.onclick=()=>select(c);c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.a);select(c)}});document.querySelectorAll('.zone').forEach(z=>{z.onclick=()=>st.sel&&place(st.sel,z);z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');place(e.dataTransfer.getData('text/plain'),z)}})}
function select(c){document.querySelectorAll('.card').forEach(x=>x.setAttribute('aria-pressed','false'));c.setAttribute('aria-pressed','true');st.sel=c.dataset.a;$('.feedback').textContent=`已選「${st.sel}」，請點地圖位置。`}
function place(a,z){if(z.classList.contains('correct'))return;if(a===z.dataset.a){z.classList.add('correct');z.textContent=a;let c=[...document.querySelectorAll('.card')].find(x=>x.dataset.a===a);c.disabled=true;st.sel=null;st.placed++;st.total++;$('.fill').style.width=st.total/16*100+'%';$('.count').textContent=`${st.total}／16`;$('.track').setAttribute('aria-valuenow',st.total);$('.feedback').className='feedback good';$('.feedback').textContent=`答對了！「${a}」就在這裡。`;if(st.placed===4){$('.feedback').textContent='這一關全部正確，航線接上了！';$('.next').style.display='block';$('.next').textContent=st.m===3?'領取闖關成功證明':'前往下一關'}}else{$('.feedback').className='feedback bad';$('.feedback').textContent=`再想一想：「${a}」不在這裡。`;z.classList.add('wrong');setTimeout(()=>z.classList.remove('wrong'),500)}}
$('.hint').onclick=()=>{$('.feedback').className='feedback';$('.feedback').textContent='提示：'+ms[st.m].h};$('.next').onclick=()=>{if(st.m<3){st.m++;render();scrollTo(0,0)}else{$('#game').style.display='none';$('#cert').style.display='grid';$('.name').textContent=st.name;$('.date').textContent='完成日期：'+new Intl.DateTimeFormat('zh-TW',{dateStyle:'long'}).format(new Date());document.title=st.name+'的闖關成功證明｜臺灣！我來了';scrollTo(0,0)}};
</script></body></html>
